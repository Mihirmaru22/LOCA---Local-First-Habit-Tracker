[versions]
kotlin                  = "2.0.21"
agp                     = "8.9.1"
composeBom              = "2024.11.00"
composeMultiplatform    = "1.7.0"
coroutines              = "1.9.0"
serialization           = "1.7.3"
datetime                = "0.6.1"
room                    = "2.7.0-alpha11"
ksp                     = "2.0.21-1.0.28"
activityCompose         = "1.9.3"
healthConnect           = "1.1.0-rc01"
navigationCompose       = "2.8.3"

[libraries]
# Compose
compose-bom                 = { group = "androidx.compose",             name = "compose-bom",           version.ref = "composeBom"   }
compose-ui                  = { group = "androidx.compose.ui",          name = "ui"                                                  }
compose-ui-graphics         = { group = "androidx.compose.ui",          name = "ui-graphics"                                         }
compose-ui-tooling-preview  = { group = "androidx.compose.ui",          name = "ui-tooling-preview"                                  }
compose-ui-tooling          = { group = "androidx.compose.ui",          name = "ui-tooling"                                          }
compose-material3           = { group = "androidx.compose.material3",   name = "material3"                                           }
compose-material-icons      = { group = "androidx.compose.material",    name = "material-icons-extended"                             }
activity-compose            = { group = "androidx.activity",            name = "activity-compose",      version.ref = "activityCompose" }
navigation-compose          = { group = "androidx.navigation",          name = "navigation-compose",    version.ref = "navigationCompose" }

# KotlinX
kotlinx-coroutines-core     = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core",    version.ref = "coroutines"    }
kotlinx-coroutines-android  = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines"    }
kotlinx-serialization-json  = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime            = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime",           version.ref = "datetime"      }

# Room
room-runtime    = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler   = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-ktx        = { group = "androidx.room", name = "room-ktx",     version.ref = "room" }

# Health Connect
health-connect  = { group = "androidx.health.connect", name = "connect-client", version.ref = "healthConnect" }

# Test
kotlin-test                 = { group = "org.jetbrains.kotlin",  name = "kotlin-test",              version.ref = "kotlin"     }
kotlinx-coroutines-test     = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test",  version.ref = "coroutines" }

[plugins]
android-application     = { id = "com.android.application",                        version.ref = "agp"                  }
android-library         = { id = "com.android.library",                            version.ref = "agp"                  }
kotlin-multiplatform    = { id = "org.jetbrains.kotlin.multiplatform",             version.ref = "kotlin"               }
kotlin-android          = { id = "org.jetbrains.kotlin.android",                   version.ref = "kotlin"               }
kotlin-serialization    = { id = "org.jetbrains.kotlin.plugin.serialization",      version.ref = "kotlin"               }
compose-compiler        = { id = "org.jetbrains.kotlin.plugin.compose",            version.ref = "kotlin"               }
ksp                     = { id = "com.google.devtools.ksp",                        version.ref = "ksp"                  }
room                    = { id = "androidx.room",                                   version.ref = "room"                 }
